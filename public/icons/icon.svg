  <circle cx="210" cy="220" r="14" fill="#af0a78" />
  <circle cx="256" cy="220" r="14" fill="#af0a78" />
  <circle cx="302" cy="220" r="14" fill="#af0a78" />
  <circle cx="210" cy="270" r="14" fill="#af0a78" />
